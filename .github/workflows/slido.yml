name: slido-watch

on:
  workflow_dispatch:
    inputs:
      code:
        description: Slido code
        required: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    container:
      image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.49.0 requests
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
      - run: python -u slido_watch.py "$CODE"
        env:
          CODE: ${{ inputs.code }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
